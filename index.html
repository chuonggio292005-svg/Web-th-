<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhysicsLab 11 - Chuyên Đề Điện Trường</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- React App Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- MAIN APP COMPONENT ---
    function App() {
      const [role, setRole] = useState('landing'); // 'landing' | 'student' | 'teacher' | 'parent'
      
      // Student Profile State
      const [studentInfo, setStudentInfo] = useState({
        name: '',
        className: '',
        isSubmitted: false,
        isApproved: false
      });

      // Global Student List for Teacher Approval
      const [studentList, setStudentList] = useState([
        { id: 1, name: "Nguyễn Văn An", className: "11A1", rank: "Chiến Binh", exp: 1850, status: "Approved", homework: "Đã nộp" },
        { id: 2, name: "Trần Thị Bích", className: "11A1", rank: "Cao Thủ", exp: 4200, status: "Approved", homework: "Đã nộp" },
        { id: 3, name: "Lê Hoàng Cường", className: "11A2", rank: "Tập Sự", exp: 800, status: "Approved", homework: "Chưa nộp" },
      ]);

      const [exp, setExp] = useState(1850);

      // Re-render Lucide Icons on DOM update
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Gamification Rank Calculation
      const getRank = (expPoints) => {
        if (expPoints < 500) return { title: 'Tân Binh', badge: '🌱' };
        if (expPoints < 1500) return { title: 'Tập Sự', badge: '⚡' };
        if (expPoints < 3500) return { title: 'Chiến Binh', badge: '🛡️' };
        if (expPoints < 7000) return { title: 'Cao Thủ', badge: '👑' };
        return { title: 'Huyền Thoại', badge: '🔥' };
      };

      const currentRank = getRank(exp);

      // Register Student Request
      const handleRegisterStudent = (name, className) => {
        const newStudent = {
          id: Date.now(),
          name: name,
          className: className,
          rank: "Tân Binh",
          exp: 0,
          status: "Pending",
          homework: "Chưa nộp"
        };
        setStudentInfo({ name, className, isSubmitted: true, isApproved: false });
        setStudentList(prev => [...prev, newStudent]);
      };

      // Check approval status continuously
      useEffect(() => {
        if (studentInfo.isSubmitted) {
          const match = studentList.find(
            s => s.name.toLowerCase() === studentInfo.name.toLowerCase() && 
                 s.className.toLowerCase() === studentInfo.className.toLowerCase()
          );
          if (match && match.status === 'Approved') {
            setStudentInfo(prev => ({ ...prev, isApproved: true }));
          }
        }
      }, [studentList, studentInfo.name, studentInfo.className]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Light-themed Navbar */}
          <header className="border-b border-slate-200 bg-white shadow-sm sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div 
                onClick={() => setRole('landing')}
                className="flex items-center space-x-3 cursor-pointer group"
              >
                <div className="p-2.5 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl shadow-md text-white group-hover:scale-105 transition-transform">
                  <i data-lucide="zap" className="w-5 h-5"></i>
                </div>
                <div>
                  <h1 className="text-xl font-bold text-slate-900 tracking-tight">
                    PhysicsLab <span className="text-cyan-600">11</span>
                  </h1>
                  <p className="text-xs text-slate-500 font-medium">Chuyên đề: Điện Trường</p>
                </div>
              </div>

              {/* Role Switcher */}
              <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-sm">
                <button
                  onClick={() => setRole('landing')}
                  className={`px-3.5 py-1.5 rounded-lg transition-all flex items-center space-x-1.5 font-medium ${
                    role === 'landing' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <i data-lucide="compass" className="w-4 h-4"></i>
                  <span>Trang Chủ</span>
                </button>
                <button
                  onClick={() => setRole('student')}
                  className={`px-3.5 py-1.5 rounded-lg transition-all flex items-center space-x-1.5 font-medium ${
                    role === 'student' ? 'bg-cyan-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <i data-lucide="users" className="w-4 h-4"></i>
                  <span>Học Sinh</span>
                </button>
                <button
                  onClick={() => setRole('teacher')}
                  className={`px-3.5 py-1.5 rounded-lg transition-all flex items-center space-x-1.5 font-medium ${
                    role === 'teacher' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <i data-lucide="user-check" className="w-4 h-4"></i>
                  <span>Giáo Viên</span>
                </button>
                <button
                  onClick={() => setRole('parent')}
                  className={`px-3.5 py-1.5 rounded-lg transition-all flex items-center space-x-1.5 font-medium ${
                    role === 'parent' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <i data-lucide="shield" className="w-4 h-4"></i>
                  <span>Phụ Huynh</span>
                </button>
              </div>

              {/* User Status */}
              <div className="flex items-center space-x-3">
                {role === 'student' && studentInfo.isApproved && (
                  <div className="px-3 py-1.5 rounded-xl border border-slate-200 bg-white shadow-sm flex items-center space-x-2">
                    <span className="text-lg">{currentRank.badge}</span>
                    <div>
                      <div className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Cấp bậc</div>
                      <div className="text-xs font-bold text-slate-800">{currentRank.title} ({exp} EXP)</div>
                    </div>
                  </div>
                )}
                {role === 'teacher' && (
                  <div className="px-3.5 py-1.5 rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-800 text-xs font-semibold">
                    Giáo Viên Bộ Môn Vật Lý
                  </div>
                )}
                {role === 'parent' && (
                  <div className="px-3.5 py-1.5 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-800 text-xs font-semibold">
                    Cổng Giám Sát Phụ Huynh
                  </div>
                )}
                {role === 'landing' && (
                  <button 
                    onClick={() => setRole('student')} 
                    className="px-4 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-semibold shadow-md shadow-cyan-600/20 transition"
                  >
                    Đăng Nhập Lớp
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
            {role === 'landing' && <LandingHome onSelectRole={(r) => setRole(r)} />}
            {role === 'student' && (
              <StudentPortal 
                studentInfo={studentInfo} 
                onRegister={handleRegisterStudent} 
                exp={exp} 
                setExp={setExp} 
                rank={currentRank} 
              />
            )}
            {role === 'teacher' && (
              <TeacherPortal 
                studentList={studentList} 
                setStudentList={setStudentList} 
              />
            )}
            {role === 'parent' && <ParentPortal exp={exp} rank={currentRank} studentInfo={studentInfo} />}
          </main>
        </div>
      );
    }

    // --- LANDING HOME ---
    function LandingHome({ onSelectRole }) {
      return (
        <div className="space-y-12">
          {/* Hero Banner */}
          <div className="rounded-3xl bg-white border border-slate-200 p-8 md:p-12 shadow-xl relative overflow-hidden">
            <div className="absolute top-0 right-0 w-96 h-96 bg-cyan-100/60 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute bottom-0 left-0 w-96 h-96 bg-blue-100/60 rounded-full blur-3xl pointer-events-none"></div>
            
            <div className="relative z-10 max-w-3xl space-y-6">
              <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-cyan-50 border border-cyan-200 text-cyan-700 text-xs font-bold">
                <i data-lucide="sparkles" className="w-4 h-4 text-cyan-600"></i>
                <span>Nền Tảng Tương Tác Học Tập Vật Lý 11</span>
              </div>

              <h1 className="text-3xl md:text-5xl font-extrabold text-slate-900 leading-tight tracking-tight">
                Chinh Phục <span className="bg-clip-text text-transparent bg-gradient-to-r from-cyan-600 to-blue-600">Chương Điện Trường</span> Với Gamification & Thí Nghiệm Trực Quan
              </h1>

              <p className="text-slate-600 text-base md:text-lg leading-relaxed">
                Hệ sinh thái kết nối <strong className="text-slate-900">Học Sinh - Giáo Viên - Phụ Huynh</strong>. Trực quan hóa các khái niệm lực Coulomb, đường sức điện thông qua thí nghiệm mô phỏng 2D và lộ trình thăng cấp danh hiệu sinh động.
              </p>

              <div className="flex flex-wrap items-center gap-4 pt-2">
                <button 
                  onClick={() => onSelectRole('student')}
                  className="px-6 py-3.5 rounded-2xl bg-cyan-600 hover:bg-cyan-700 text-white font-bold text-sm shadow-lg shadow-cyan-600/20 flex items-center space-x-2 transition transform hover:-translate-y-0.5"
                >
                  <span>Nhập Họ Tên & Đăng Nhập Lớp</span>
                  <i data-lucide="arrow-right" className="w-4 h-4"></i>
                </button>
                <button 
                  onClick={() => onSelectRole('teacher')}
                  className="px-6 py-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-800 font-semibold text-sm transition"
                >
                  Dành Cho Giáo Viên
                </button>
              </div>
            </div>
          </div>

          {/* Features */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm hover:shadow-md transition">
              <div className="p-3 bg-cyan-50 text-cyan-600 rounded-xl w-fit mb-4">
                <i data-lucide="gamepad-2" className="w-6 h-6"></i>
              </div>
              <h3 className="text-lg font-bold text-slate-900 mb-2">Gamification Thăng Cấp</h3>
              <p className="text-sm text-slate-600 leading-relaxed">
                Học sinh tích lũy điểm EXP từ bài tập về nhà và thí nghiệm để thăng hạng từ Tân Binh → Tập Sự → Chiến Binh → Cao Thủ → Huyền Thoại.
              </p>
            </div>

            <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm hover:shadow-md transition">
              <div className="p-3 bg-blue-50 text-blue-600 rounded-xl w-fit mb-4">
                <i data-lucide="laptop" className="w-6 h-6"></i>
              </div>
              <h3 className="text-lg font-bold text-slate-900 mb-2">Mô Phỏng Thí Nghiệm 2D</h3>
              <p className="text-sm text-slate-600 leading-relaxed">
                Thí nghiệm tương tác kéo thả điện tích q₁, q₂ và điều chỉnh khoảng cách r trực tiếp trên Canvas, quan sát vectơ lực Coulomb thời gian thực.
              </p>
            </div>

            <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm hover:shadow-md transition">
              <div className="p-3 bg-indigo-50 text-indigo-600 rounded-xl w-fit mb-4">
                <i data-lucide="graduation-cap" className="w-6 h-6"></i>
              </div>
              <h3 className="text-lg font-bold text-slate-900 mb-2">Công Cụ Giáo Viên & Phụ Huynh</h3>
              <p className="text-sm text-slate-600 leading-relaxed">
                Tích hợp Vòng quay gọi bài cũ ngẫu nhiên trên lớp, duyệt danh sách học sinh theo tên/lớp và báo cáo chuyên cần cho phụ huynh.
              </p>
            </div>
          </div>

          {/* Rank Progression */}
          <div className="bg-white border border-slate-200 p-8 rounded-2xl shadow-sm">
            <div className="text-center max-w-xl mx-auto mb-8 space-y-2">
              <h2 className="text-2xl font-bold text-slate-900">Lộ Trình Thăng Cấp Danh Hiệu</h2>
              <p className="text-xs text-slate-500">Hoàn thành bài tập đúng hạn để nhận điểm kinh nghiệm EXP và mở khóa cấp bậc mới.</p>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-5 gap-4 text-center">
              {[
                { badge: "🌱", title: "Tân Binh", exp: "0 - 499 EXP", color: "bg-slate-50 border-slate-200" },
                { badge: "⚡", title: "Tập Sự", exp: "500 - 1499 EXP", color: "bg-emerald-50 border-emerald-200" },
                { badge: "🛡️", title: "Chiến Binh", exp: "1500 - 3499 EXP", color: "bg-cyan-50 border-cyan-200" },
                { badge: "👑", title: "Cao Thủ", exp: "3500 - 6999 EXP", color: "bg-purple-50 border-purple-200" },
                { badge: "🔥", title: "Huyền Thoại", exp: "7000+ EXP", color: "bg-amber-50 border-amber-200" }
              ].map((r, i) => (
                <div key={i} className={`p-4 rounded-xl border ${r.color} space-y-2`}>
                  <div className="text-3xl">{r.badge}</div>
                  <div className="font-bold text-sm text-slate-800">{r.title}</div>
                  <div className="text-[11px] font-mono text-slate-500">{r.exp}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- STUDENT PORTAL ---
    function StudentPortal({ studentInfo, onRegister, exp, setExp, rank }) {
      const [inputName, setInputName] = useState('');
      const [inputClass, setInputClass] = useState('11A1');
      const [activeTab, setActiveTab] = useState('simulations');
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [quizFeedback, setQuizFeedback] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!inputName.trim() || !inputClass.trim()) return;
        onRegister(inputName, inputClass);
      };

      if (!studentInfo.isSubmitted) {
        return (
          <div className="max-w-md mx-auto my-12 bg-white border border-slate-200 p-8 rounded-3xl shadow-xl">
            <div className="text-center space-y-3 mb-6">
              <div className="w-12 h-12 bg-cyan-100 text-cyan-600 rounded-2xl flex items-center justify-center mx-auto">
                <i data-lucide="user-plus" className="w-6 h-6"></i>
              </div>
              <h2 className="text-2xl font-bold text-slate-900">Đăng Nhập Gia Nhập Lớp Học</h2>
              <p className="text-xs text-slate-500">
                Vui lòng điền Họ tên và Tên lớp của bạn. Yêu cầu sẽ được gửi tới Giáo viên bộ môn để duyệt vào danh sách lớp.
              </p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Họ và Tên Học Sinh</label>
                <input 
                  type="text"
                  required
                  placeholder="Ví dụ: Nguyễn Văn An"
                  value={inputName}
                  onChange={(e) => setInputName(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none text-slate-800 text-sm font-medium"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Tên Lớp Học</label>
                <input 
                  type="text"
                  required
                  placeholder="Ví dụ: 11A1, 11A2..."
                  value={inputClass}
                  onChange={(e) => setInputClass(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none text-slate-800 text-sm font-medium"
                />
              </div>

              <button
                type="submit"
                className="w-full py-3.5 bg-cyan-600 hover:bg-cyan-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-cyan-600/20 transition"
              >
                Gửi Yêu Cầu Vào Lớp
              </button>
            </form>
          </div>
        );
      }

      if (!studentInfo.isApproved) {
        return (
          <div className="max-w-md mx-auto my-12 bg-white border border-amber-200 p-8 rounded-3xl shadow-xl text-center space-y-4">
            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto animate-pulse">
              <i data-lucide="clock" className="w-8 h-8"></i>
            </div>
            <h2 className="text-xl font-bold text-slate-900">Đang Chờ Giáo Viên Duyệt!</h2>
            <p className="text-sm text-slate-600">
              Thông tin học sinh <strong>{studentInfo.name}</strong> - Lớp <strong>{studentInfo.className}</strong> đã được gửi lên hệ thống.
            </p>
            <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
              💡 Hãy nhờ Giáo viên bấm nút "Duyệt Học Sinh" ở Phân hệ Giáo viên để bạn chính thức được tham gia học nhé!
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="p-6 rounded-2xl bg-white border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-slate-100 text-xs font-semibold text-slate-700 border border-slate-200 mb-2">
                <span>Lớp {studentInfo.className}</span>
                <span>•</span>
                <span className="text-emerald-600 font-bold">✓ Đã duyệt vào lớp</span>
              </div>
              <h2 className="text-2xl font-bold text-slate-900 flex items-center gap-2">
                Chào {studentInfo.name}! <span className="text-xl">{rank.badge}</span>
              </h2>
              <p className="text-slate-500 text-sm mt-1">
                Danh hiệu hiện tại: <span className="font-bold text-cyan-600">{rank.title}</span>. Hoàn thành nhiệm vụ để tiếp tục tích lũy EXP!
              </p>
            </div>

            <div className="w-full md:w-72 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
              <div className="flex justify-between text-xs mb-1">
                <span className="text-slate-500 font-medium">Tiến trình thăng cấp</span>
                <span className="font-bold text-cyan-600">{exp} / 3500 EXP</span>
              </div>
              <div className="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                <div 
                  className="bg-gradient-to-r from-cyan-500 to-blue-600 h-full rounded-full transition-all duration-500" 
                  style={{ width: `${Math.min(100, (exp / 3500) * 100)}%` }}
                ></div>
              </div>
            </div>
          </div>

          <div className="flex space-x-2 border-b border-slate-200 pb-2">
            <button 
              onClick={() => setActiveTab('simulations')}
              className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${activeTab === 'simulations' ? 'bg-cyan-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              🧪 Thí Nghiệm Mô Phỏng 2D
            </button>
            <button 
              onClick={() => setActiveTab('homework')}
              className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${activeTab === 'homework' ? 'bg-cyan-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              📝 Nhiệm Vụ Về Nhà
            </button>
          </div>

          {activeTab === 'simulations' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2">
                <CoulombSimulation onInteract={() => setExp(prev => prev + 10)} />
              </div>
              <div className="space-y-4">
                <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
                  <h3 className="text-md font-bold text-cyan-700 flex items-center gap-2 mb-2">
                    <i data-lucide="sparkles" className="w-5 h-5 text-cyan-600"></i> Nhiệm vụ thí nghiệm
                  </h3>
                  <p className="text-sm text-slate-600 mb-4">
                    Thử nghiệm điều chỉnh độ lớn các điện tích q₁, q₂ và khoảng cách r. Quan sát vectơ lực tương tác thay đổi trực tiếp trên mô phỏng để nhận điểm EXP.
                  </p>
                  <div className="space-y-2 text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div className="font-bold text-slate-800 mb-1">💡 Công thức cần nhớ:</div>
                    <div>Lực Coulomb: <span className="font-mono text-cyan-700 font-bold">F = k · |q₁ · q₂| / (ε · r²)</span></div>
                    <div>Trong đó: <span className="font-mono">k = 9×10⁹ N·m²/C²</span></div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'homework' && (
            <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm space-y-5">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <div>
                  <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="clock" className="w-5 h-5 text-amber-500"></i> Nhiệm vụ: Tương tác lực điện tích

                  <p className="text-xs text-slate-500 mt-0.5">Hạn nộp: <span className="text-amber-600 font-semibold">22:00 Hôm nay</span> | Phần thưởng: <span className="text-cyan-600 font-bold">+150 EXP</span></p>

              <div className="space-y-4">
                <p className="text-sm text-slate-800 font-medium leading-relaxed">
                  Câu 1: Hai điện tích điểm <span className="text-cyan-700 font-bold font-mono">q₁ = +2 µC</span> và <span className="text-rose-700 font-bold font-mono">q₂ = -4 µC</span> đặt cách nhau 10 cm trong chân không (k = 9×10⁹ N·m²/C²). Lực tương tác giữa hai điện tích có đặc điểm gì?
                </p>

                <div className="space-y-2">
                  {[
                    { id: 'A', text: 'Lực hút, độ lớn F = 7.2 N' },

                    { id: 'D', text: 'Lực đẩy, độ lớn F = 0.72 N' }
                  ].map(opt => (
                    <label 
                      key={opt.id}
                      className={`flex items-center p-3.5 rounded-xl border text-sm cursor-pointer transition ${
                        quizAnswers['q1'] === opt.id 
                          ? 'bg-cyan-50 border-cyan-500 text-cyan-900 font-semibold' 
                          : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                      }`}
                    >
                      <input 
                        type="radio" 
                        name="q1" 
                        value={opt.id} 
                        checked={quizAnswers['q1'] === opt.id}

                        className="mr-3 text-cyan-600 focus:ring-cyan-500"
                      />
                      <span><strong>{opt.id}.</strong> {opt.text}</span>
                    </label>

                </div>

                {quizFeedback && (
                  <div className="p-3 bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-xl">

                <div className="pt-4 border-t border-slate-100 flex justify-between items-center">
                  <button 
                    onClick={() => {
                      if (quizAnswers['q1'] === 'A') {
                        setQuizSubmitted(true);
                        setExp(prev => prev + 150);
                        setQuizFeedback("🎉 CHÍNH XÁC! Bạn nhận được +150 EXP.");
                      } else {
                        setQuizFeedback("❌ Chưa chính xác. Lời giải gợi ý: |q₁·q₂| = 8×10⁻¹², r² = 0.01 m². Hãy tính lại F nhé!");
                      }

                    className="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white font-bold text-sm rounded-xl disabled:opacity-50 shadow-md shadow-cyan-600/20"

                  {quizSubmitted && <span className="text-emerald-600 text-xs font-bold">✓ Đã nộp bài thành công</span>}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- TEACHER PORTAL ---

          {activeSubTab === 'approval' && (
            <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm space-y-4">
              <div className="flex justify-between items-center">

                  <h3 className="text-lg font-bold text-slate-900">Danh Sách Học Sinh Gia Nhập Lớp</h3>

                </div>
                <span className="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-lg border border-indigo-200">

              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm text-slate-700">
                  <thead className="bg-slate-50 text-xs uppercase text-slate-500 border-b border-slate-200 font-bold">
                    <tr>
                      <th className="p-3">Họ và Tên Học Sinh</th>
                      <th className="p-3">Lớp Registered</th>
                      <th className="p-3">Cấp Bậc</th>
                      <th className="p-3">EXP</th>
                      <th className="p-3">Trạng thái duyệt</th>
                      <th className="p-3 text-right">Hành động</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {studentList.map(st => (
                      <tr key={st.id} className="hover:bg-slate-50/80 transition">
                        <td className="p-3 font-bold text-slate-900">{st.name}</td>
                        <td className="p-3"><span className="px-2.5 py-1 bg-slate-100 rounded text-xs font-semibold text-slate-700">{st.className}</span></td>
                        <td className="p-3"><span className="px-2 py-0.5 bg-slate-100 border border-slate-200 rounded text-xs">{st.rank}</span></td>
                        <td className="p-3 font-mono font-bold text-cyan-600">{st.exp}</td>
                        <td className="p-3">
                          {st.status === 'Approved' ? (
                            <span className="text-emerald-600 text-xs font-bold flex items-center gap-1">✓ Đã vào lớp</span>

                            <span className="text-amber-600 text-xs font-bold flex items-center gap-1">Chờ duyệt</span>

                            <button 
                              onClick={() => approveStudent(st.id)}

          {activeSubTab === 'random' && (

    // --- PARENT PORTAL ---
    function ParentPortal({ exp, rank, studentInfo }) {
      const currentName = studentInfo.name || "Nguyễn Văn An";
      const currentClass = studentInfo.className || "11A1";

      return (
        <div className="space-y-6">
          <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <span className="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold">
                Liên kết học sinh: {currentName} - Lớp {currentClass}
              </span>
              <h2 className="text-2xl font-bold text-slate-900 mt-2">Báo Cáo Học Tập Môn Vật Lý 11</h2>
              <p className="text-slate-500 text-sm">Chuyên đề: Điện Trường</p>
            </div>
            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center min-w-[140px]">
              <div className="text-xs text-slate-400 uppercase font-bold">Cấp Bậc Hiện Tại</div>
              <div className="text-xl font-bold text-slate-800 mt-0.5">{rank.title}</div>
              <div className="text-xs text-slate-500 font-mono">{exp} EXP Tích Lũy</div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
              <div className="text-slate-400 text-xs font-bold uppercase mb-1">Mức độ chuyên cần</div>
              <div className="text-3xl font-extrabold text-emerald-600">95%</div>
              <p className="text-xs text-slate-500 mt-2">Đã hoàn thành 19/20 bài tập về nhà đúng hạn.</p>
            </div>

            <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
              <div className="text-slate-400 text-xs font-bold uppercase mb-1">Điểm kiểm tra trung bình</div>
              <div className="text-3xl font-extrabold text-cyan-600">8.8 / 10</div>
              <p className="text-xs text-slate-500 mt-2">Hoàn thành tốt các bài kiểm tra 15 phút.</p>
            </div>

            <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
              <div className="text-slate-400 text-xs font-bold uppercase mb-1">Thời gian mô phỏng</div>
              <div className="text-3xl font-extrabold text-purple-600">2.5 Giờ</div>
              <p className="text-xs text-slate-500 mt-2">Tương tác trực quan các bài thí nghiệm lực Coulomb.</p>
            </div>
          </div>
        </div>
      );
    }

    // --- COULOMB SIMULATION ---
    function CoulombSimulation({ onInteract }) {
      const [q1, setQ1] = useState(2);
      const [q2, setQ2] = useState(-4);
      const [distance, setDistance] = useState(10);
      const canvasRef = useRef(null);

      const k = 9;
      const rMeters = distance / 100;
      const force = ((k * Math.abs(q1 * q2)) / (rMeters * rMeters)).toFixed(2);
      const isAttractive = (q1 * q2) < 0;

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        ctx.strokeStyle = '#f1f5f9';
        ctx.lineWidth = 1;
        for (let x = 0; x < width; x += 20) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = 0; y < height; y += 20) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        const centerY = height / 2;
        const centerMargin = distance * 4;
        const x1 = (width / 2) - centerMargin;
        const x2 = (width / 2) + centerMargin;

        ctx.strokeStyle = '#94a3b8';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(x1, centerY);
        ctx.lineTo(x2, centerY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`r = ${distance} cm`, width / 2, centerY - 15);

        const drawCharge = (x, y, q, label) => {
          ctx.beginPath();
          ctx.arc(x, y, 22, 0, Math.PI * 2);
          ctx.fillStyle = q > 0 ? '#ef4444' : q < 0 ? '#2563eb' : '#64748b';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(q > 0 ? `+${q}µC` : `${q}µC`, x, y);

          ctx.fillStyle = '#334155';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(label, x, y + 36);
        };

        drawCharge(x1, centerY, q1, 'Điện tích q₁');
        drawCharge(x2, centerY, q2, 'Điện tích q₂');

        const arrowLen = Math.min(80, Math.max(20, force * 0.8));
        const drawArrow = (fromX, fromY, toX, color) => {
          ctx.beginPath();
          ctx.moveTo(fromX, fromY);
          ctx.lineTo(toX, fromY);
          ctx.strokeStyle = color;
          ctx.lineWidth = 4;
          ctx.stroke();

          const headLen = 8;
          const dir = toX > fromX ? 1 : -1;
          ctx.beginPath();
          ctx.moveTo(toX, fromY);
          ctx.lineTo(toX - dir * headLen, fromY - headLen / 1.5);
          ctx.lineTo(toX - dir * headLen, fromY + headLen / 1.5);
          ctx.fillStyle = color;
          ctx.fill();
        };

        if (isAttractive) {
          drawArrow(x1, centerY, x1 + arrowLen, '#0891b2');
          drawArrow(x2, centerY, x2 - arrowLen, '#0891b2');
        } else {
          drawArrow(x1, centerY, x1 - arrowLen, '#e11d48');
          drawArrow(x2, centerY, x2 + arrowLen, '#e11d48');
        }

      }, [q1, q2, distance, force, isAttractive]);

      return (
        <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
          <div className="flex justify-between items-center mb-4">
            <h3 className="text-md font-bold text-slate-900 flex items-center gap-2">
              🧪 Thí nghiệm mô phỏng: Định luật Coulomb
            </h3>
            <span className={`text-xs px-2.5 py-1 rounded-full font-bold border ${isAttractive ? 'bg-cyan-50 text-cyan-800 border-cyan-200' : 'bg-rose-50 text-rose-800 border-rose-200'}`}>
              {isAttractive ? 'LỰC HÚT (Trái dấu)' : 'LỰC ĐẨY (Cùng dấu)'}
            </span>
          </div>

          <div className="bg-slate-50 rounded-xl border border-slate-200 overflow-hidden relative">
            <canvas ref={canvasRef} width={600} height={220} className="w-full h-auto block" />
            <div className="absolute bottom-3 right-3 bg-white border border-slate-200 px-3 py-1.5 rounded-xl shadow-sm text-xs font-mono text-slate-700">
              Lực F = <span className="text-lg font-extrabold text-cyan-600">{force}</span> N
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div>
              <label className="text-xs font-bold text-slate-700 flex justify-between">
                <span>Điện tích q₁:</span>
                <span className="font-mono text-cyan-700">{q1 > 0 ? `+${q1}` : q1} µC</span>
              </label>
              <input 
                type="range" min="-10" max="10" step="1" value={q1} 
                onChange={(e) => { setQ1(Number(e.target.value)); onInteract(); }}
                className="w-full accent-cyan-600 mt-1"
              />
            </div>

            <div>
              <label className="text-xs font-bold text-slate-700 flex justify-between">
                <span>Điện tích q₂:</span>
                <span className="font-mono text-cyan-700">{q2 > 0 ? `+${q2}` : q2} µC</span>
              </label>
              <input 
                type="range" min="-10" max="10" step="1" value={q2} 
                onChange={(e) => { setQ2(Number(e.target.value)); onInteract(); }}
                className="w-full accent-cyan-600 mt-1"
              />
            </div>

            <div>
              <label className="text-xs font-bold text-slate-700 flex justify-between">
                <span>Khoảng cách r:</span>
                <span className="font-mono text-cyan-700">{distance} cm</span>
              </label>
              <input 
                type="range" min="5" max="25" step="1" value={distance} 
                onChange={(e) => { setDistance(Number(e.target.value)); onInteract(); }}
                className="w-full accent-cyan-600 mt-1"
              />
            </div>
          </div>
        </div>
      );
    }

    // --- RANDOM STUDENT PICKER ---
    function RandomStudentPicker({ students }) {
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [isSpinning, setIsSpinning] = useState(false);

      const startRandomPick = () => {
        if (students.length === 0) return;
        setIsSpinning(true);
        setSelectedStudent(null);

        let counter = 0;
        const interval = setInterval(() => {
          const randomIndex = Math.floor(Math.random() * students.length);
          setSelectedStudent(students[randomIndex]);
          counter++;

          if (counter > 25) {
            clearInterval(interval);
            setIsSpinning(false);
          }
        }, 100);
      };

      return (
        <div className="bg-white border border-indigo-200 p-8 rounded-2xl text-center shadow-md relative overflow-hidden">
          <div className="max-w-md mx-auto space-y-6">
            <div>
              <span className="px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-bold">
                Công cụ Tương tác Trực tiếp Trên Lớp
              </span>
              <h3 className="text-2xl font-bold text-slate-900 mt-2">Vòng Quay Dò Bài Cũ Ngẫu Nhiên</h3>
              <p className="text-slate-500 text-xs mt-1">Bấm nút để chọn ngẫu nhiên một học sinh trả lời bài cũ!</p>
            </div>

            <div className="h-36 flex items-center justify-center bg-slate-50 rounded-2xl border-2 border-dashed border-indigo-300 p-6">
              {selectedStudent ? (
                <div className={`transition-all ${isSpinning ? 'scale-90 opacity-70 blur-[1px]' : 'scale-110 opacity-100'}`}>
                  <div className="text-2xl font-extrabold text-indigo-900">{selectedStudent.name}</div>
                  <div className="text-xs text-slate-500 mt-1">Lớp: <strong>{selectedStudent.className}</strong> | Danh hiệu: <span className="text-cyan-600 font-bold">{selectedStudent.rank}</span></div>
                </div>
              ) : (
                <div className="text-slate-400 text-sm italic">Sẵn sàng quay số...</div>
              )}
            </div>

            <button
              onClick={startRandomPick}
              disabled={isSpinning || students.length === 0}
              className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base rounded-xl shadow-lg shadow-indigo-600/20 disabled:opacity-50 transition"
            >
              {isSpinning ? 'Đang chọn ngẫu nhiên...' : 'QUAY SỐ GỌI BÀI CŨ'}
            </button>
          </div>
        </div>
      );
    }

    // Render to Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
